name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew build

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugin
          path: paper/build/libs/paper-*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mod
          path: neoforge/build/libs/neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: |
            fabric/build/libs/fabric-*.jar
            !fabric/build/libs/*-dev-shadow*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paper-plugin/*.jar
            neoforge-mod/*.jar
            fabric-mod/*.jar
          generate_release_notes: true
