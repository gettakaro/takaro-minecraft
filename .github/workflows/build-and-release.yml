name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            ./gradlew build -Pversion="SNAPSHOT-${SHORT_SHA}"
          else
            ./gradlew build
          fi

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugin
          path: paper/build/libs/takaro-paper-*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mod
          path: neoforge/build/libs/takaro-neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: |
            fabric/build/libs/takaro-fabric-*.jar
            !fabric/build/libs/*-dev-shadow*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set release info
        id: release_info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            DATE=$(date -u +%Y-%m-%d)
            echo "tag_name=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_name=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          files: |
            paper-plugin/*.jar
            neoforge-mod/*.jar
            fabric-mod/*.jar
          generate_release_notes: true
